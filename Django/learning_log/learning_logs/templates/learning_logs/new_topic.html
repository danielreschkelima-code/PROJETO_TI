{% extends "learning_logs/base.html" %}
{% load bootstrap3 %}

{% block header %}
        <h2>Adicione um novo tópico: </h2>
{% endblock header %}


{% block content %}

    <form class="form" action="{% url 'new_topic' %}" method='post'>

        {% csrf_token %} <!-- Essa tag em django é indispensável para formulários. Promove segurança -->
        {% bootstrap_form form %}

        {% buttons %}
        <button class="btn btn-primary" name="submit">Adicionar</button>
        {% endbuttons %}

    </form>

{% endblock content %}
